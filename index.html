<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NLS Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    
    /* Landing Page Card */
    .card { background: #111827; border: 1px solid #1f2937; padding: 2.5rem; border-radius: 16px; text-align: center; max-width: 420px; width: 90%; }
    .badge { display: inline-block; background: #1e293b; color: #38bdf8; font-size: 0.8rem; font-weight: 600; padding: 6px 14px; border-radius: 20px; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; margin-bottom: 0.8rem; }
    p { color: #9ca3af; font-size: 0.95rem; line-height: 1.5; }

    /* Developer Modal Window */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; }
    .modal { background: #1f2937; border: 1px solid #374151; width: 90%; max-width: 380px; padding: 2rem; border-radius: 12px; position: relative; }
    .modal-title { font-size: 1.25rem; font-weight: bold; color: #10b981; margin-bottom: 0.5rem; text-align: center; }
    .modal-subtitle { font-size: 0.85rem; color: #9ca3af; text-align: center; margin-bottom: 1.5rem; }

    /* Form & Login Elements */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #d1d5db; margin-bottom: 0.4rem; text-align: left; }
    .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 0.9rem; }
    .btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: #1d4ed8; }
    .close-btn { position: absolute; top: 12px; right: 15px; color: #9ca3af; cursor: pointer; font-size: 1.2rem; }
  </style>
</head>
<body>

  <!-- Landing Page Content -->
  <div class="card">
    <div class="badge">🛠 UNDER DEVELOPMENT</div>
    <h1>NLS Studio</h1>
    <p>We are crafting something extraordinary. Our platform is currently undergoing active development and will launch soon.</p>
  </div>

  <!-- Developer Mode Login Modal -->
  <div class="modal-overlay" id="devModal">
    <div class="modal">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="modal-title">🔓 Developer Mode</div>
      <p class="modal-subtitle">Authenticate with Firebase to access console</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Developer Email</label>
          <input type="email" id="email" required placeholder="dev@nlsstudio.online" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn">Login to Portal</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "nlsstudio.online",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Secret Code Listener (SYAFA)
    let typedKeys = "";
    const secretCode = "SYAFA";
    const devModal = document.getElementById("devModal");
    const closeModal = document.getElementById("closeModal");

    window.addEventListener("keydown", (e) => {
      typedKeys += e.key.toUpperCase();
      if (typedKeys.length > secretCode.length) {
        typedKeys = typedKeys.substr(typedKeys.length - secretCode.length);
      }
      if (typedKeys === secretCode) {
        devModal.style.display = "flex";
        typedKeys = ""; 
      }
    });

    closeModal.addEventListener("click", () => {
      devModal.style.display = "none";
    });

    // Firebase Login Handling
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        alert("Authenticated as Developer: " + userCredential.user.email);
        // Redirect or load developer tools here
      } catch (error) {
        alert("Authentication failed: " + error.message);
      }
    });
  </script>
</body>
</html>
