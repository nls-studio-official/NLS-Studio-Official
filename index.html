<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NLS Studio</title>
  <style>
    :root {
      --bg: #0e0f12;
      --surface: #181a20;
      --surface-variant: #22252e;
      --primary-red: #ff4b68;
      --accent-blue: #4d9fff;
      --text-main: #e6e8ee;
      --text-sub: #8c92a4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Minimal Card */
    .card {
      background: var(--surface);
      width: 90%;
      max-width: 380px;
      padding: 2rem;
      border-radius: 28px;
      text-align: center;
      position: relative;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 75, 104, 0.12);
      color: var(--primary-red);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 1.5rem;
    }

    .dot { width: 6px; height: 6px; background: var(--primary-red); border-radius: 50%; }

    h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.4rem; letter-spacing: -0.5px; }
    p { color: var(--text-sub); font-size: 0.9rem; line-height: 1.4; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      width: 90%;
      max-width: 360px;
      padding: 1.8rem;
      border-radius: 28px;
      position: relative;
    }

    .close-btn { position: absolute; top: 16px; right: 20px; color: var(--text-sub); cursor: pointer; font-size: 1.2rem; }

    /* Material Segmented Button Switcher */
    .segmented-control {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 100px;
      margin-bottom: 1.2rem;
    }
    .segment-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px;
      border-radius: 100px;
      cursor: pointer;
    }
    .segment-btn.active { background: var(--surface-variant); color: var(--accent-blue); }

    .auth-form { display: none; flex-direction: column; gap: 0.75rem; }
    .auth-form.active { display: flex; }

    .input-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: none;
      background: var(--bg);
      color: #fff;
      font-size: 0.88rem;
    }
    .input-box:focus { outline: 2px solid var(--accent-blue); }

    .input-label { font-size: 0.72rem; color: var(--text-sub); text-align: left; margin-left: 4px; margin-bottom: -0.2rem; }

    .btn-submit {
      padding: 12px;
      background: var(--primary-red);
      color: #fff;
      border: none;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 0.4rem;
    }

    .btn-google {
      width: 100%;
      padding: 11px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 0.6rem;
    }

    /* Panels */
    .panel { display: none; width: 90%; max-width: 600px; background: var(--surface); padding: 1.8rem; border-radius: 28px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .btn-sm { padding: 6px 14px; border-radius: 100px; border: none; background: var(--surface-variant); color: #fff; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="card" id="landingCard">
    <div class="status-pill"><span class="dot"></span> UNDER DEVELOPMENT</div>
    <h1>NLS Studio</h1>
    <p>Clean, simple workspace interface.</p>
  </div>

  <div class="modal-overlay" id="devModal">
    <div class="modal">
      <span class="close-btn" id="closeModal">&times;</span>

      <div class="segmented-control">
        <button class="segment-btn active" id="tabLogin">Login</button>
        <button class="segment-btn" id="tabSignup">Sign Up</button>
      </div>

      <form class="auth-form active" id="loginForm">
        <input type="email" class="input-box" id="loginEmail" placeholder="Email" required />
        <input type="password" class="input-box" id="loginPassword" placeholder="Password" required />
        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <form class="auth-form" id="signupForm">
        <input type="email" class="input-box" id="signupEmail" placeholder="Email" required />
        <input type="password" class="input-box" id="signupPassword" placeholder="Password" required />
        <span class="input-label">Date of Birth</span>
        <input type="date" class="input-box" id="signupDob" required />
        <button type="submit" class="btn-submit" style="background: var(--accent-blue); color: #000;">Create Account</button>
      </form>

      <button class="btn-google" id="googleBtn">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>

  <div class="panel" id="dashBoard">
    <div class="panel-header">
      <h2>Console <span style="color: var(--accent-blue); font-size: 0.85rem;" id="userDisplay"></span></h2>
      <button class="btn-sm" id="logoutBtn">Sign Out</button>
    </div>
    <p style="color: var(--text-sub);">Welcome to the developer console.</p>
  </div>

  <div class="panel" id="ownerPortal">
    <div class="panel-header">
      <h2>Owner Settings</h2>
      <button class="btn-sm" id="ownerExitBtn" style="background: var(--primary-red);">Close</button>
    </div>
    <p style="color: var(--text-sub);">Owner privileges active.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCHKeqNYWuhLEg12Tge0ND5WjDlQurua_0",
      // Pointed directly to firebaseapp.com to fix Google Sign-In 404
      authDomain: "nls-studio-official.firebaseapp.com",
      databaseURL: "https://nls-studio-official-default-rtdb.firebaseio.com",
      projectId: "nls-studio-official",
      storageBucket: "nls-studio-official.firebasestorage.app",
      messagingSenderId: "182900300287",
      appId: "1:182900300287:web:dcb9a143b04130a8d66fca",
      measurementId: "G-NZPWP75L62"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const devModal = document.getElementById("devModal");
    const landingCard = document.getElementById("landingCard");
    const dashBoard = document.getElementById("dashBoard");
    const ownerPortal = document.getElementById("ownerPortal");
    const userDisplay = document.getElementById("userDisplay");

    // Keys Listener
    let keys = "";
    window.addEventListener("keydown", (e) => {
      keys += e.key.toUpperCase();
      if (keys.length > 5) keys = keys.substring(1);
      if (keys.endsWith("SYAFA")) { devModal.style.display = "flex"; keys = ""; }
      if (keys.endsWith("ZARA")) {
        landingCard.style.display = "none";
        devModal.style.display = "none";
        dashBoard.style.display = "none";
        ownerPortal.style.display = "block";
        keys = "";
      }
    });

    document.getElementById("closeModal").onclick = () => devModal.style.display = "none";

    // Tabs
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    tabLogin.onclick = () => {
      tabLogin.classList.add("active"); tabSignup.classList.remove("active");
      loginForm.classList.add("active"); signupForm.classList.remove("active");
    };
    tabSignup.onclick = () => {
      tabSignup.classList.add("active"); tabLogin.classList.remove("active");
      signupForm.classList.add("active"); loginForm.classList.remove("active");
    };

    const enterConsole = (user) => {
      devModal.style.display = "none";
      landingCard.style.display = "none";
      dashBoard.style.display = "block";
      userDisplay.textContent = user.email;
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
        enterConsole(res.user);
      } catch (err) { alert(err.message); }
    };

    signupForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await createUserWithEmailAndPassword(auth, signupEmail.value, signupPassword.value);
        enterConsole(res.user);
      } catch (err) { alert(err.message); }
    };

    document.getElementById("googleBtn").onclick = async () => {
      try {
        const res = await signInWithPopup(auth, provider);
        enterConsole(res.user);
      } catch (err) { alert(err.message); }
    };

    document.getElementById("logoutBtn").onclick = () => {
      signOut(auth).then(() => {
        dashBoard.style.display = "none";
        landingCard.style.display = "block";
      });
    };

    document.getElementById("ownerExitBtn").onclick = () => {
      ownerPortal.style.display = "none";
      landingCard.style.display = "block";
    };
  </script>
</body>
</html>
