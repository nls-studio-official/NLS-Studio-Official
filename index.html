<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLS Studio - Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617, #000000);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }
    .container {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 45px 35px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p.description {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .secret-trigger {
      font-size: 28px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.2s ease, filter 0.2s ease;
      margin-bottom: 10px;
    }
    .secret-trigger:hover {
      transform: scale(1.15) rotate(10deg);
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
    }
    .hidden { display: none !important; }
    
    /* SECRET ACCESS FORM */
    .secret-box {
      margin-top: 15px;
      animation: fadeIn 0.3s ease-out;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 14px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s ease;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: filter 0.2s ease;
    }
    button:hover { filter: brightness(1.1); }
    .error-msg { color: #f87171; font-size: 12px; margin-top: 8px; }

    /* DEV DASHBOARD */
    .dev-badge {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    .dev-dot { background-color: #4ade80; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
    .status-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #4ade80, #38bdf8);
      border-radius: 4px;
    }
    .btn-exit { background: #dc2626; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- PUBLIC COMING SOON CARD -->
  <div id="public-view" class="container">
    <div class="secret-trigger" id="secret-btn" title="???">🛠️</div>
    <br>
    <div class="badge"><div class="pulse-dot"></div> Under Development</div>
    <h1>NLS Studio</h1>
    <p class="description">We are crafting something extraordinary. Our platform is currently undergoing active development and will launch soon.</p>

    <!-- SECRET CODE INPUT AREA -->
    <div id="secret-box" class="secret-box hidden">
      <input type="password" id="access-code" placeholder="Enter Access Code">
      <button id="btn-unlock">Unlock Developer Portal</button>
      <p id="code-error" class="error-msg"></p>
    </div>
  </div>

  <!-- DEVELOPER MODE DASHBOARD -->
  <div id="dev-view" class="container hidden">
    <div class="badge dev-badge"><div class="pulse-dot dev-dot"></div> Developer Mode</div>
    <h1>Welcome, Developer</h1>
    <p class="description">Authenticated Session Active. You have full system preview privileges.</p>

    <div class="status-card">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600;">
        <span>Official Build Progress</span>
        <span style="color: #4ade80;">45% Ready</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <button id="btn-lock" class="btn-exit">Exit Developer Mode</button>
  </div>

  <script>
    const secretBtn = document.getElementById('secret-btn');
    const secretBox = document.getElementById('secret-box');
    const accessCodeInput = document.getElementById('access-code');
    const unlockBtn = document.getElementById('btn-unlock');
    const codeError = document.getElementById('code-error');
    const publicView = document.getElementById('public-view');
    const devView = document.getElementById('dev-view');
    const lockBtn = document.getElementById('btn-lock');

    // Toggle secret code input box on tapping icon
    secretBtn.addEventListener('click', () => {
      secretBox.classList.toggle('hidden');
      codeError.textContent = '';
      accessCodeInput.value = '';
    });

    // Check for secret passcode SYAFA
    unlockBtn.addEventListener('click', () => {
      const code = accessCodeInput.value.trim();
      if (code === 'SYAFA') {
        publicView.classList.add('hidden');
        devView.classList.remove('hidden');
        codeError.textContent = '';
      } else {
        codeError.textContent = 'Invalid Access Code.';
      }
    });

    // Exit developer mode back to public coming soon screen
    lockBtn.addEventListener('click', () => {
      devView.classList.add('hidden');
      publicView.classList.remove('hidden');
      secretBox.classList.add('hidden');
      accessCodeInput.value = '';
    });
  </script>
</body>
</html>
