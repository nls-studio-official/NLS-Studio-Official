<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLS Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: radial-gradient(circle at top left, #1a1c29, #0a0b10);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 35px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; text-align: center; }
    h3 { font-size: 14px; text-transform: uppercase; tracking: 1px; color: #94a3b8; margin: 24px 0 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 6px; text-align: left; }
    .form-group { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .dob-group { display: flex; gap: 8px; }
    .dob-group select { width: 33.33%; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.98); }
    .btn-google { background: #ea4335; margin-top: 14px; }
    .btn-action { background: linear-gradient(135deg, #16a34a, #059669); }
    p { font-size: 13px; color: #94a3b8; margin-top: 18px; text-align: center; }
    a { color: #38bdf8; font-weight: 600; cursor: pointer; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hidden { display: none !important; }
    .error { color: #f87171; font-size: 13px; margin-top: 10px; text-align: center; }
    .success { color: #4ade80; font-size: 13px; margin-top: 10px; text-align: center; }
    .divider { margin: 20px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); line-height: 0.1em; text-align: center; }
    .divider span { background: #161b22; padding: 0 10px; color: #64748b; font-size: 12px; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .info-label { color: #94a3b8; }
    .info-val { color: #fff; font-weight: 600; }
  </style>
</head>
<body>

  <div id="login-box" class="card">
    <h2>NLS Studio Login</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="name@domain.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" required>
    </div>
    <button id="btn-login">Log In</button>
    
    <div class="divider"><span>OR</span></div>
    <button id="btn-google-login" class="btn-google">Sign in with Google</button>

    <p id="login-error" class="error"></p>
    <p>Don't have an account? <a id="go-to-signup">Sign Up</a></p>
  </div>

  <div id="signup-box" class="card hidden">
    <h2>Join NLS Studio</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="signup-username" placeholder="Choose a handle" required>
    </div>
    
    <div class="form-group">
      <label>Birthday</label>
      <div class="dob-group">
        <select id="dob-month" required>
          <option value="" disabled selected>Month</option>
          <option value="Jan">Jan</option><option value="Feb">Feb</option>
          <option value="Mar">Mar</option><option value="Apr">Apr</option>
          <option value="May">May</option><option value="Jun">Jun</option>
          <option value="Jul">Jul</option><option value="Aug">Aug</option>
          <option value="Sep">Sep</option><option value="Oct">Oct</option>
          <option value="Nov">Nov</option><option value="Dec">Dec</option>
        </select>
        <select id="dob-day" required>
          <option value="" disabled selected>Day</option>
        </select>
        <select id="dob-year" required>
          <option value="" disabled selected>Year</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="signup-email" placeholder="name@domain.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label>Phone Number (Optional)</label>
      <input type="tel" id="signup-phone" placeholder="+1 234 567 8900">
    </div>

    <button id="btn-signup">Create Account</button>
    
    <div class="divider"><span>OR</span></div>
    <button id="btn-google-signup" class="btn-google">Sign up with Google</button>

    <p id="signup-error" class="error"></p>
    <p>Already a member? <a id="go-to-login">Log In</a></p>
  </div>

  <div id="dashboard-box" class="card hidden">
    <h2>NLS Studio</h2>
    <p>Welcome back, <strong id="user-display-name" style="color:#38bdf8;">...</strong></p>
    
    <h3>Account Details</h3>
    <div class="info-row"><span class="info-label">Email</span><span id="setting-email" class="info-val">...</span></div>
    <div class="info-row"><span class="info-label">Password</span><span class="info-val">••••••••</span></div>
    <div class="info-row"><span class="info-label">Phone</span><span id="setting-phone" class="info-val">Not set</span></div>
    <div class="info-row"><span class="info-label">Birthday</span><span id="setting-dob" class="info-val">Not set</span></div>
    <div class="info-row"><span class="info-label">Joined</span><span id="setting-joined" class="info-val">...</span></div>

    <h3>Security</h3>
    <div class="form-group">
      <input type="password" id="new-password" placeholder="Enter new password">
    </div>
    <button id="btn-change-pass" class="btn-action">Update Password</button>
    
    <p id="settings-msg"></p>
    <button id="btn-logout" style="background: #dc2626; margin-top: 20px;">Sign Out</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, updatePassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCHKeqNYWuhLEg12Tge0ND5WjDlQurua_0",
      authDomain: "nls-studio-official.firebaseapp.com",
      databaseURL: "https://nls-studio-official-default-rtdb.firebaseio.com",
      projectId: "nls-studio-official",
      storageBucket: "nls-studio-official.firebasestorage.app",
      messagingSenderId: "182900300287",
      appId: "1:182900300287:web:dcb9a143b04130a8d66fca"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    // Populate Roblox-style Date Pickers
    const daySelect = document.getElementById('dob-day');
    for (let i = 1; i <= 31; i++) {
      let opt = document.createElement('option');
      opt.value = i; opt.textContent = i;
      daySelect.appendChild(opt);
    }

    const yearSelect = document.getElementById('dob-year');
    for (let i = 2026; i >= 1920; i--) {
      let opt = document.createElement('option');
      opt.value = i; opt.textContent = i;
      yearSelect.appendChild(opt);
    }

    // Toggle Forms
    document.getElementById('go-to-signup').addEventListener('click', () => {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('signup-box').classList.remove('hidden');
    });
    document.getElementById('go-to-login').addEventListener('click', () => {
      document.getElementById('signup-box').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    });

    // Save Database Record
    async function handleUserData(user, customData = {}) {
      const userRef = ref(db, 'members/' + user.uid);
      const snapshot = await get(userRef);
      if (!snapshot.exists()) {
        await set(userRef, {
          username: customData.username || user.displayName || user.email.split('@')[0],
          email: user.email,
          phone: customData.phone || 'Not set',
          birthday: customData.birthday || 'Not set',
          joinedAt: new Date().toLocaleDateString()
        });
      }
    }

    // Handlers
    const loginWithGoogle = async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        await handleUserData(result.user);
      } catch (err) {
        document.getElementById('login-error').textContent = err.message;
        document.getElementById('signup-error').textContent = err.message;
      }
    };

    document.getElementById('btn-google-login').addEventListener('click', loginWithGoogle);
    document.getElementById('btn-google-signup').addEventListener('click', loginWithGoogle);

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const username = document.getElementById('signup-username').value;
      const phone = document.getElementById('signup-phone').value;
      const m = document.getElementById('dob-month').value;
      const d = document.getElementById('dob-day').value;
      const y = document.getElementById('dob-year').value;
      const errorEl = document.getElementById('signup-error');
      errorEl.textContent = '';

      if (!m || !d || !y) {
        errorEl.textContent = "Please select your complete birthday.";
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await handleUserData(userCredential.user, { username, phone, birthday: `${m} ${d}, ${y}` });
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    document.getElementById('btn-change-pass').addEventListener('click', async () => {
      const newPass = document.getElementById('new-password').value;
      const msgEl = document.getElementById('settings-msg');
      if (!newPass) {
        msgEl.className = 'error';
        msgEl.textContent = 'Please type a new password.';
        return;
      }
      try {
        await updatePassword(auth.currentUser, newPass);
        msgEl.className = 'success';
        msgEl.textContent = 'Password updated!';
        document.getElementById('new-password').value = '';
      } catch (err) {
        msgEl.className = 'error';
        msgEl.textContent = err.message;
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // Auth State Monitor
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('dashboard-box').classList.remove('hidden');

        document.getElementById('setting-email').textContent = user.email;

        try {
          const snapshot = await get(child(ref(db), `members/${user.uid}`));
          if (snapshot.exists()) {
            const data = snapshot.val();
            document.getElementById('user-display-name').textContent = data.username || user.email;
            document.getElementById('setting-phone').textContent = data.phone || 'Not set';
            document.getElementById('setting-dob').textContent = data.birthday || 'Not set';
            document.getElementById('setting-joined').textContent = data.joinedAt || 'Today';
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        document.getElementById('dashboard-box').classList.add('hidden');
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
